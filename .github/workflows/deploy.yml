name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: fast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Verify build output
        run: |
          ls -la ./dist
          test -f ./dist/index.html || { echo "::error::dist/index.html 不存在，检查 build 输出目录"; exit 1; }

      # ---------- 部署前自检：把 wrangler 吞掉的错误提前暴露 ----------
      - name: Preflight - verify token & account
        run: |
          set -o pipefail
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::secret CLOUDFLARE_API_TOKEN 未配置"; exit 1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error::secret CLOUDFLARE_ACCOUNT_ID 未配置"; exit 1
          fi

          echo "== 1) 校验 API Token"
          resp=$(curl -s -w '\n%{http_code}' https://api.cloudflare.com/client/v4/user/tokens/verify \
                  -H "Authorization: Bearer $CF_TOKEN")
          body=$(echo "$resp" | sed '$d'); code=$(echo "$resp" | tail -1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Token 无效或已过期（HTTP $code）。去 Cloudflare → My Profile → API Tokens 重新生成，权限需含 Account → Cloudflare Pages → Edit"
            exit 1
          fi

          echo "== 2) 校验 Account ID 与 Pages 项目"
          resp=$(curl -s -w '\n%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT" \
                  -H "Authorization: Bearer $CF_TOKEN")
          body=$(echo "$resp" | sed '$d'); code=$(echo "$resp" | tail -1)
          echo "HTTP $code"
          echo "$body"

          if [ "$code" = "200" ]; then
            echo "项目 $PROJECT 已存在"
            echo "$body" | jq -r '"production_branch = " + (.result.production_branch // "null")'
          elif [ "$code" = "404" ]; then
            echo "项目不存在，自动创建……"
            resp=$(curl -s -w '\n%{http_code}' -X POST \
                    "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" \
                    -H "Authorization: Bearer $CF_TOKEN" \
                    -H "Content-Type: application/json" \
                    --data "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}")
            echo "$resp"
            [ "$(echo "$resp" | tail -1)" = "200" ] || { echo "::error::创建 Pages 项目失败，看上面的 error 字段"; exit 1; }
          elif [ "$code" = "403" ]; then
            echo "::error::Token 没有 Pages 权限，或 Account ID 不属于这个 token"
            exit 1
          else
            echo "::error::查询项目失败（HTTP $code），检查 CLOUDFLARE_ACCOUNT_ID 是否为 32 位十六进制"
            exit 1
          fi

      # ---------- 直接跑 wrangler，错误完整输出到日志 ----------
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.90.0 pages deploy ./dist \
            --project-name="$PROJECT" \
            --branch=main \
            --commit-dirty=true

      - name: Print deployment URL
        if: success()
        run: echo "已部署到 https://${{ env.PROJECT }}.pages.dev"
